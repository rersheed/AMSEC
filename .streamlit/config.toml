[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
# Dark theme to match the custom CSS (src/amsec/dashboard/theme.py paints a dark background;
# a light base theme rendered native text dark-on-dark).
base = "dark"
primaryColor = "#3987e5"
backgroundColor = "#07111f"
secondaryBackgroundColor = "#0b1220"
textColor = "#e8edf5"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"

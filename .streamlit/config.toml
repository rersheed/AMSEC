[server]
headless = true
enableCORS = false
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#0B3D5C"
backgroundColor = "#F7F9FB"
secondaryBackgroundColor = "#E8EEF3"
textColor = "#102A3C"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "minimal"
